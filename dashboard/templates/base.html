{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mi Ecommerce{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/productos.css' %}">
</head>
<body>
    <header class="navbar">
        <a href="{% url 'index' %}" class="logo">🛍️ Mi Ecommerce</a>
        <nav>
            <a href="{% url 'index' %}">Inicio</a>
            <a href="{% url 'agregar' %}" class="btn-nav">Dashboard</a>
        </nav>
    </header>

    <main class="container">
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li class="msg {{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2026 Mi Ecommerce</p>
    </footer>
</body>
</html>
